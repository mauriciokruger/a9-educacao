<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Capa A9 Educação</title>
<style>
{{FONT_CSS}}
*{box-sizing:border-box}html,body{margin:0;width:1600px;background:#03081C;color:white;font-family:Poppins,sans-serif}
.hero{width:1600px;height:620px;padding:64px 72px;position:relative;display:grid;grid-template-columns:960px 1fr;gap:48px}
.logo{width:248px;height:auto;display:block;margin-bottom:42px}
h1{font-size:76px;line-height:1.12;letter-spacing:-2px;font-weight:700;margin:0}
h1 span{color:#6DFF30}
.sub{font-size:25px;line-height:1.55;color:rgba(255,255,255,.78);margin:24px 0 0;max-width:840px}
.signature{position:absolute;left:72px;bottom:44px;font-size:18px;font-weight:600;letter-spacing:2px;color:rgba(255,255,255,.55)}
.signature::before{content:"";display:inline-block;width:64px;height:3px;background:linear-gradient(90deg,#6DFF30,#29FFE8);vertical-align:middle;margin-right:20px}
.capabilities{align-self:center;border-top:1px solid #1E2F6A;border-bottom:1px solid #1E2F6A;padding:30px 0 32px}
.eyebrow{font-size:17px;letter-spacing:2px;font-weight:600;color:#29FFE8;margin:0 0 28px}
.capabilities p:not(.eyebrow){font-size:28px;line-height:1.65;letter-spacing:-.4px;margin:0;color:rgba(255,255,255,.9)}
.capabilities strong{font-weight:600}
.cta-row{height:156px;display:flex;gap:32px;padding:42px 40px;background:#F6F7FB}
.button{display:flex;justify-content:center;align-items:center;width:360px;height:72px;border-radius:10px;font-size:23px;font-weight:600;gap:16px}
.download{background:#6DFF30;color:#03081C}
.install{background:#050E2A;color:white}
.examples{background:#0A1638;color:#29FFE8}
.icon{font-size:30px;line-height:1}
</style>
<body>
<div class="hero">
 <div><img class="logo" src="{{LOGO}}" alt="A9 Educação"><h1>Nossa identidade.<br><span>Em cada criação.</span></h1><p class="sub">A skill da A9 Educação para transformar pedidos<br>em materiais com o nosso padrão.</p></div>
 <div class="capabilities"><p class="eyebrow">UM PADRÃO. VÁRIAS ENTREGAS.</p><p><strong>Apresentações</strong><br>Sites e sistemas<br>Documentos<br>Conteúdo</p></div>
 <div class="signature">DO CONHECIMENTO AO RESULTADO</div>
</div>
<div class="cta-row">
 <div class="button download">Baixar a skill <span class="icon">↓</span></div>
 <div class="button install">Como instalar <span class="icon">→</span></div>
 <div class="button examples">Ver exemplos <span class="icon">→</span></div>
</div>
</body></html>
